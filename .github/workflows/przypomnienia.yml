name: Przypomnienia

on:
  schedule:
    - cron: '17 * * * *'   # co godzinę; skrypt sam decyduje, komu i czy wysłać
  workflow_dispatch:
    inputs:
      tryb:
        description: 'normalny albo test (test wysyła przykładowe przypomnienie od razu)'
        required: false
        default: 'normalny'
      profil:
        description: 'dla trybu test: damian, marcin, teresa albo diana'
        required: false
        default: 'damian'

permissions:
  contents: write

concurrency:
  group: przypomnienia
  cancel-in-progress: false

jobs:
  przypomnij:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Sprawdź sesje i wyślij przypomnienia
        run: node _przypomnienia/przypomnij.mjs
        env:
          NTFY_TOPICS: ${{ secrets.NTFY_TOPICS }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_LOG_TOPIC: ${{ secrets.NTFY_LOG_TOPIC }}
          TRYB: ${{ github.event.inputs.tryb || 'normalny' }}
          PROFIL: ${{ github.event.inputs.profil || 'damian' }}

      - name: Zapisz stan
        run: |
          if [ -n "$(git status --porcelain _przypomnienia)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add _przypomnienia/stan.json
            git commit -m "Stan przypomnień"
            git pull --rebase --quiet
            git push
          fi
